<script>
  // Capture every error from the very first byte (module load failures included) → RLP.errors.
  window.__RLP_ERRORS = [];
  window.__RLP_CAPTURE = true;
  window.addEventListener('error', function (e) {
    window.__RLP_ERRORS.push({ type: 'error', message: String(e.message || (e.error && e.error.message) || e), stack: e.error && e.error.stack, source: e.filename, line: e.lineno });
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__RLP_ERRORS.push({ type: 'unhandledrejection', message: String((r && r.message) || r), stack: r && r.stack });
  });
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
